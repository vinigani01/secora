version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: secora_user
      POSTGRES_PASSWORD: secora_pass
      POSTGRES_DB: secora_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://secora_user:secora_pass@db:5432/secora_db
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend

volumes:
  pgdata:
